# MAGS ERP portal: never hand out the private upload folder directly.
#
# Homework, answers, notes, student photos, documents and admission form files
# are stored in wp-content/uploads/mags-erp-private/ and reach people only
# through /portal/file/ after the portal checks who is asking. Apache obeys the
# .htaccess file in that folder; nginx does not read .htaccess, so it needs this
# rule inside the site's server { ... } block.
#
# Local (this computer): open the site's folder, then conf/nginx/site.conf.hbs,
# paste the rule inside server { ... } above the first "location" line, save,
# and restart the site in Local.
#
# Hosting with nginx: add it to the site's server block and reload nginx.
#
# "^~" makes this rule win over every other location (images, PHP files),
# wherever it stands in the block. If WordPress keeps uploads somewhere else,
# use the path shown under More -> Settings -> Private files in the portal.
#
# Afterwards, open More -> Settings in the portal and press "Check again":
# it should say "Closed".

location ^~ /wp-content/uploads/mags-erp-private/ {
	deny all;
}
